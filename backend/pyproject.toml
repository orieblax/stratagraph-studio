[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stratagraph-studio-backend"
version = "0.1.0"
description = "StrataGraph Studio: Modular Monolith Visual Agentic Orchestration, Medallion RAG & MCP Control Plane"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "sqlglot>=23.0.0",
    "structlog>=24.1.0",
    "pyjwt[crypto]>=2.8.0",
    "bcrypt>=4.1.0",
    "httpx>=0.27.0",
    "aiofiles>=23.2.0",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29.0",
    "pgvector>=0.2.5",
    "tenacity>=8.3.0",
    "databricks-sdk>=0.28.0",
    "databricks-sql-connector>=3.1.0",
    "langgraph>=0.2.0",
    "langchain-core>=0.2.0",
    "langsmith>=0.1.60",
    "pydantic-ai>=2.66.0",
    "onnxruntime>=1.17.0",
    "numpy>=1.26.0",
    "filetype>=1.2.0",
    "typing-extensions>=4.11.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "types-aiofiles>=23.2.0",
    "bandit>=1.7.8",
    "pip-audit>=2.7.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "SIM", "ARG"]
ignore = ["E501", "B008"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = false
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = [
    "databricks",
    "databricks.sdk.*",
    "databricks.sql.*",
    "pgvector",
    "pgvector.*",
    "filetype",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["src"]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::UserWarning",
]
