name: CI/CD Pipeline - Security, Backend & Frontend

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security-and-backend:
    name: Backend SAST & Unit Tests
    runs-on: ubuntu-latest
    services:
      postgres-pgvector:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: stratagraph
          POSTGRES_PASSWORD: stratagraph_secure_password
          POSTGRES_DB: stratagraph_studio
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r requirements.txt
          pip install pytest pytest-asyncio ruff mypy types-aiofiles bandit pip-audit

      - name: Run Python SAST Scan (Bandit)
        run: |
          bandit -r src -ll -ii

      - name: Run Ruff Linter & Formatter Check
        run: |
          ruff check src tests

      - name: Run Static Type Analysis (mypy --strict)
        run: |
          mypy --strict src

      - name: Initialize Database Schema
        run: |
          command -v psql >/dev/null 2>&1 || (sudo apt-get update && sudo apt-get install -y postgresql-client)
          PGPASSWORD=stratagraph_secure_password psql -h localhost -U stratagraph -d stratagraph_studio -f ../docker/postgres/init.sql

      - name: Run Pytest Suite with Coverage
        env:
          DATABASE_URL: postgresql+asyncpg://stratagraph:stratagraph_secure_password@localhost:5432/stratagraph_studio
          ENVIRONMENT: testing
          JWT_SECRET_KEY: test_secret_key_minimum_32_characters_long_for_ci_suite
          SAFE_UPLOAD_DIR: /tmp/safe_uploads
          RERANKER_DEVICE_POLICY: cpu
        run: |
          mkdir -p /tmp/safe_uploads
          pytest tests -v --asyncio-mode=auto

  frontend-and-vercel:
    name: Frontend Lint, Typecheck & Vercel Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Set up Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Node Dependencies
        run: |
          npm ci || npm install

      - name: Run ESLint
        run: |
          npm run lint --if-present

      - name: Run TypeScript Strict Check
        run: |
          npx tsc --noEmit

      - name: Run Frontend Unit Tests
        run: |
          npm test --if-present

      - name: Build Next.js 15 Application
        env:
          NEXT_PUBLIC_BACKEND_URL: https://api.stratagraph.local
          BACKEND_URL: https://api.stratagraph.local
        run: |
          npm run build --if-present
